caseId: abb-rack-pdu
title: ABB Rack PDU Market Entry
question: "Should ABB pursue the rack PDU business, and if yes, should it be built internally, acquired, or partnered into?"
frameworkId: market-entry-tiered

substitutions:
  COMPANY: ABB
  PRODUCT: rack PDU (intelligent/managed segment)
  # Keep SCOPE short — it is interpolated inline into hypothesis claims and
  # falsifiers (see frameworks/market-entry-tiered.yaml). Anything sentence-
  # length here dominates the prose. The "accessible geographies / ex-restricted
  # markets" qualifier lives in the falsifiers (which already say "accessible
  # geographies") and in SCOPE_LONG below for the case question / brief text.
  SCOPE: the global data center market
  SCOPE_LONG: global data center market, accessible geographies excluding restricted markets
  THRESHOLD_LOWER: $50M annual revenue
  THRESHOLD_UPPER: $100M annual revenue
  HORIZON: 3 years
  PARITY_BENCHMARKS: Vertiv, Schneider Electric, Eaton
  IRR_HURDLE: 15%

weights:
  market-attractive: 0.25
  can-win: 0.20
  can-reach: 0.15
  financials-clear: 0.20
  tech-resilient: 0.20

thresholds:
  minRevenue: 100000000
  timeYears: 3
  irrHurdle: 0.15
  internalDevMaxYears: 3

inputDocs:
  - path: docs/abb-case-brief.pdf
    type: brief
    author: Innovera
    stake: neutral-advocate
  - path: docs/abb-rack-pdu-deck.pdf
    type: pitch
    author: ABB Energy Distribution BL
    stake: pre-disposed-favourable      # noted: slide 6 pre-concludes
